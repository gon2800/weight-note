<style>
  :root{
    --bg:#F5F6FB; --card:#FFFFFF; --ink:#1F2437; --sub:#7A809A;
    --line:#EBEDF4; --accent:#5B54E8; --accent-soft:#EEEDFD;
    --drink:#EF6C6C;
    --food-hi:#E8894A; --food-mid:#F0B429; --food-lo:#3FB950;
    --shadow:0 1px 2px rgba(31,36,55,.04),0 8px 24px rgba(31,36,55,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; padding:16px 16px 40px}
  .tabnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

  .top{display:flex; align-items:center; justify-content:space-between; padding:8px 4px 14px}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:11px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .brand h1{font-size:19px; margin:0; letter-spacing:-.4px}
  .brand small{display:block;color:var(--sub);font-size:11px;font-weight:600;letter-spacing:.2px}
  .iconbtn{border:none;background:var(--card);width:40px;height:40px;border-radius:12px;
    box-shadow:var(--shadow); color:var(--ink); font-size:17px; cursor:pointer}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .cal-nav{display:flex;gap:8px;align-items:center}
  .navbtn{border:none;background:var(--bg);width:36px;height:36px;border-radius:10px;
    color:var(--ink);font-size:16px;cursor:pointer}
  .today-btn{border:none;background:var(--accent-soft);color:var(--accent);font-weight:700;
    font-size:12px;padding:0 12px;height:36px;border-radius:10px;cursor:pointer}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:11px;font-weight:700;color:var(--sub);padding-bottom:6px}
  .dow .sun{color:#E9698A}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{aspect-ratio:1/1.15;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;padding-top:6px;cursor:pointer;position:relative;background:transparent;
    border:1px solid transparent;transition:background .12s}
  .cell.empty{cursor:default}
  .cell:active{background:var(--bg)}
  .cell .d{font-size:13px;font-weight:600;color:var(--ink);line-height:1}
  .cell.sun .d{color:#E9698A}
  .cell.today{background:var(--accent);}
  .cell.today .d{color:#fff}
  .cell .w{font-size:11px;font-weight:800;color:var(--accent);margin-top:4px}
  .cell.today .w{color:#fff}
  .cell .dot{width:6px;height:6px;border-radius:50%;position:absolute;bottom:6px}
  .cell.today .dot{outline:1.5px solid rgba(255,255,255,.6)}

  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:transparent;padding:8px 0;border-radius:9px;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  .chart-stats{display:flex;gap:8px;margin-bottom:10px}
  .stat{flex:1;background:var(--bg);border-radius:12px;padding:9px 12px}
  .stat .lab{font-size:10px;color:var(--sub);font-weight:700}
  .stat .val{font-size:16px;font-weight:800;margin-top:2px}
  .stat .val small{font-size:11px;color:var(--sub);font-weight:700}
  .chart-box{width:100%}
  .empty-msg{text-align:center;color:var(--sub);font-size:13px;padding:40px 0;font-weight:600}
  .legend{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:10px;
    font-size:11px;color:var(--sub);font-weight:600;flex-wrap:wrap}
  .legend .cap{color:var(--ink);font-weight:800}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
  .legend .bar-i{width:7px;height:11px;border-radius:2px}
  .legend .pct{color:var(--drink);font-weight:800}

  .backdrop{position:fixed;inset:0;background:rgba(20,22,35,.4);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:20}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);z-index:21;
    max-width:520px;margin:0 auto;box-shadow:0 -8px 40px rgba(31,36,55,.15)}
  .sheet.show{transform:translateY(0)}
  .handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 16px}
  .sheet .date-lab{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px;text-align:center}
  .field-lab{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
  .w-input{display:flex;align-items:center;background:var(--bg);border-radius:14px;
    padding:0 16px;margin-bottom:20px;border:2px solid transparent}
  .w-input:focus-within{border-color:var(--accent)}
  .w-input input{flex:1;border:none;background:transparent;font-size:26px;font-weight:800;
    padding:14px 0;outline:none;color:var(--ink);width:100%}
  .w-input input::placeholder{color:#C4C8D8;font-weight:700}
  .w-input span{font-size:15px;font-weight:700;color:var(--sub)}
  .rate,.drink{display:flex;gap:8px;margin-bottom:20px}
  .rate button{flex:1;border:2px solid var(--line);background:var(--card);padding:14px 0;
    border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .rate button .rdot{width:8px;height:8px;border-radius:50%}
  .rate button.sel[data-v="상"]{background:#FCEEE3;border-color:var(--food-hi)}
  .rate button.sel[data-v="중"]{background:#FDF4E0;border-color:var(--food-mid)}
  .rate button.sel[data-v="하"]{background:#E9F8ED;border-color:var(--food-lo)}
  .drink{margin-bottom:24px}
  .drink button{flex:1;border:2px solid var(--line);background:var(--card);padding:14px 0;
    border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink)}
  .drink button.sel[data-a="0"]{border-color:var(--ink);background:var(--bg)}
  .drink button.sel[data-a="1"]{border-color:var(--drink);background:#FDECEC;color:var(--drink)}
  .actions{display:flex;gap:10px}
  .btn{flex:1;border:none;padding:15px 0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}
  .btn.save{background:var(--accent);color:#fff}
  .btn.del{background:var(--bg);color:var(--drink);flex:0 0 96px}

  .menu{position:fixed;inset:0;z-index:22;pointer-events:none}
  .menu.show{pointer-events:auto}
  .menu .mbd{position:absolute;inset:0;background:rgba(20,22,35,.4);opacity:0;transition:opacity .2s}
  .menu.show .mbd{opacity:1}
  .menu .mpanel{position:absolute;right:16px;top:64px;background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);padding:6px;min-width:180px;transform:scale(.9);opacity:0;
    transform-origin:top right;transition:.15s}
  .menu.show .mpanel{transform:scale(1);opacity:1}
  .menu .mpanel button{display:block;width:100%;text-align:left;border:none;background:transparent;
    padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink);border-radius:10px;cursor:pointer}
  .menu .mpanel button:active{background:var(--bg)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">체</div>
      <div><h1>체중 노트</h1><small>MY WEIGHT LOG</small></div>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button>
  </div>

  <div class="card">
    <div class="cal-head">
      <div class="cal-title" id="calTitle">2026 / 07</div>
      <div class="cal-nav">
        <button class="navbtn" id="prevBtn" aria-label="이전 달">‹</button>
        <button class="today-btn" id="todayBtn">오늘</button>
        <button class="navbtn" id="nextBtn" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="dow">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card">
    <div class="seg" id="seg">
      <button data-p="7" class="on">1주</button>
      <button data-p="31">1개월</button>
      <button data-p="183">6개월</button>
      <button data-p="365">1년</button>
    </div>
    <div class="chart-stats">
      <div class="stat"><div class="lab">최근</div><div class="val tabnum" id="stLast">–</div></div>
      <div class="stat"><div class="lab">최저</div><div class="val tabnum" id="stMin">–</div></div>
      <div class="stat"><div class="lab">최고</div><div class="val tabnum" id="stMax">–</div></div>

  <div class="handle"></div>
  <div class="date-lab" id="sheetDate">2026년 7월 28일</div>
  <div class="field-lab">오늘의 체중</div>
  <div class="w-input">
    <input id="wInput" type="number" inputmode="decimal" step="0.1" placeholder="0.0" aria-label="체중 입력">
    <span>kg</span>
  </div>

<script>
const KEY="weightNote.v1";
const FOOD_COLOR={"상":"#E8894A","중":"#F0B429","하":"#3FB950"};
const DRINK_COLOR="#EF6C6C";
let data=load();
let view=new Date(); view.setDate(1);
let selKey=null, selRate=null, selDrink=0;

function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY)); return (r&&r.entries)?r:{entries:{}};}
  catch(e){return {entries:{}};}
}
function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }
function keyOf(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function todayKey(){ const t=new Date(); return keyOf(t.getFullYear(),t.getMonth(),t.getDate()); }

/* ---------- 캘린더 ---------- */
function renderCalendar(){
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById("calTitle").textContent=y+" / "+String(m+1).padStart(2,"0");
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const tk=todayKey();
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="cell empty"; grid.appendChild(e); }
  for(let d=1;d<=days;d++){
    const k=keyOf(y,m,d);
    const rec=data.entries[k];
    const cell=document.createElement("div");
    cell.className="cell"+((first+d-1)%7===0?" sun":"")+(k===tk?" today":"");
    let html='<div class="d">'+d+'</div>';
    if(rec&&rec.w!=null) html+='<div class="w tabnum">'+rec.w+'</div>';
    if(rec&&rec.f) html+='<div class="dot" style="background:'+FOOD_COLOR[rec.f]+'"></div>';
    cell.innerHTML=html;
    cell.onclick=()=>openSheet(k);
    grid.appendChild(cell);
  }
}

/* ---------- 입력 시트 ---------- */
function openSheet(k){
  selKey=k;
  const [y,m,d]=k.split("-").map(Number);
  document.getElementById("sheetDate").textContent=y+"년 "+m+"월 "+d+"일";
  const rec=data.entries[k]||{};
  document.getElementById("wInput").value=(rec.w!=null?rec.w:"");
  selRate=rec.f||null;
  selDrink=(rec.a===true)?1:0;
  paintRate(); paintDrink();
  document.getElementById("delBtn").style.display=data.entries[k]?"block":"none";
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
function paintRate(){
  document.querySelectorAll("#rate button").forEach(b=>b.classList.toggle("sel", b.dataset.v===selRate));
}
function paintDrink(){
  document.querySelectorAll("#drink button").forEach(b=>b.classList.toggle("sel", b.dataset.a===String(selDrink)));
}
document.querySelectorAll("#rate button").forEach(b=>{
  b.onclick=()=>{ selRate=(selRate===b.dataset.v?null:b.dataset.v); paintRate(); };
});
document.querySelectorAll("#drink button").forEach(b=>{
  b.onclick=()=>{ selDrink=+b.dataset.a; paintDrink(); };
});
document.getElementById("saveBtn").onclick=()=>{
  const raw=document.getElementById("wInput").value.trim();
  const w=raw===""?null:parseFloat(raw);
  if(w===null && !selRate && selDrink!==1){ closeSheet(); return; }
  data.entries[selKey]={};
  if(w!==null && !isNaN(w)) data.entries[selKey].w=Math.round(w*10)/10;
  if(selRate) data.entries[selKey].f=selRate;
  if(selDrink===1) data.entries[selKey].a=true;
  save(); closeSheet(); renderCalendar(); renderChart();
};
document.getElementById("delBtn").onclick=()=>{
  delete data.entries[selKey]; save(); closeSheet(); renderCalendar(); renderChart();
};
document.getElementById("backdrop").onclick=closeSheet;

/* ---------- 그래프 ---------- */
let period=7;
document.querySelectorAll("#seg button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); period=+b.dataset.p; renderChart();
  };
});
function seriesForPeriod(){
  const now=new Date(); now.setHours(0,0,0,0);
  const from=new Date(now); from.setDate(from.getDate()-(period-1));
  const arr=[];
  for(const k in data.entries){
    const rec=data.entries[k];
    if(rec.w==null) continue;
    const [y,m,d]=k.split("-").map(Number);
    const dt=new Date(y,m-1,d);
    if(dt>=from && dt<=now) arr.push({dt,k,w:rec.w});
  }
  arr.sort((a,b)=>a.dt-b.dt);
  return arr;
}
function renderChart(){
  const s=seriesForPeriod();
  const box=document.getElementById("chartBox");
  const stLast=document.getElementById("stLast"),
        stMin=document.getElementById("stMin"),
        stMax=document.getElementById("stMax"),
        legendDrink=document.getElementById("legendDrink");
  if(s.length===0){
    box.innerHTML='<div class="empty-msg">이 기간에 기록된 체중이 없어요.<br>날짜를 눌러 체중을 입력해 보세요.</div>';
    stLast.textContent=stMin.textContent=stMax.textContent="–";
    legendDrink.innerHTML=""; return;
  }
  const ws=s.map(p=>p.w);
  const mn=Math.min(...ws), mx=Math.max(...ws), last=s[s.length-1].w;
  stLast.innerHTML=last+'<small> kg</small>';
  stMin.innerHTML=mn+'<small> kg</small>';
  stMax.innerHTML=mx+'<small> kg</small>';

  const W=488, padL=8, padR=8, iw=W-padL-padR;
  const lineTop=18, lineBottom=158, ih=lineBottom-lineTop;
  const barBottom=216, barH=40, barTop=barBottom-barH;
  const H=240;
  const lo=mn-((mx-mn)*.25+.4), hi=mx+((mx-mn)*.25+.4);
  const span=(hi-lo)||1;
  const n=s.length;
  const x=i=> n===1 ? padL+iw/2 : padL + (iw*i/(n-1));
  const y=v=> lineTop + ih*(1-(v-lo)/span);

  // gridlines
  const gy=[mx,(mx+mn)/2,mn];
  let grid="";
  gy.forEach(v=>{
    const yy=y(v).toFixed(1);
    grid+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#EEF0F6" stroke-width="1"/>';
    grid+='<text x="'+(W-padR)+'" y="'+(yy-4)+'" text-anchor="end" font-size="10" fill="#B7BCCD" font-weight="600">'+v.toFixed(1)+'</text>';
  });

  // smooth line
  const pts=s.map((p,i)=>[x(i),y(p.w)]);
  let dPath="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    dPath+="C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  const area=dPath+" L"+pts[pts.length-1][0].toFixed(1)+","+lineBottom+" L"+pts[0][0].toFixed(1)+","+lineBottom+" Z";

  // dots = 음주 여부
  let drinkCount=0, dots="";
  s.forEach((p,i)=>{
    const drank=data.entries[p.k].a===true;
    if(drank) drinkCount++;
    const r=(i===n-1)?6:5;
    const fill=drank?DRINK_COLOR:"#fff";
    const stroke=drank?"#fff":"#B9BED0";
    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
  });
  const lx=x(n-1), ly=y(last);
  const lbx=Math.min(Math.max(lx,padL+14), W-padR-14);
  dots+='<text x="'+lbx.toFixed(1)+'" y="'+(ly-12).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#5B54E8">'+last+'</text>';

  // 식사량 막대
  let bars='<line x1="'+padL+'" y1="'+barBottom+'" x2="'+(W-padR)+'" y2="'+barBottom+'" stroke="#EEF0F6" stroke-width="1"/>';
  const bw=Math.max(4, Math.min(14, (iw/n)*0.5));
  s.forEach((p,i)=>{
    const f=data.entries[p.k].f;
    if(!f) return;
    const level=f==="상"?3:(f==="중"?2:1);
    const h=barH*level/3;
    const bx=(x(i)-bw/2).toFixed(1);
    const by=(barBottom-h).toFixed(1);
    bars+='<rect x="'+bx+'" y="'+by+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+FOOD_COLOR[f]+'"/>';
  });

  // x labels
  const idxs=n<=2?[0,n-1]:[0,Math.floor((n-1)/2),n-1];
  let xlab="";
  [...new Set(idxs)].forEach(i=>{
    const p=s[i]; const lab=(p.dt.getMonth()+1)+"/"+p.dt.getDate();
    let anchor="middle"; if(i===0)anchor="start"; if(i===n-1)anchor="end";
    xlab+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anchor+'" font-size="10" fill="#B7BCCD" font-weight="600">'+lab+'</text>';
  });

  box.innerHTML=
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'+
      '<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#5B54E8" stop-opacity=".16"/>'+
        '<stop offset="1" stop-color="#5B54E8" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      grid+
      '<path d="'+area+'" fill="url(#fill)"/>'+
      '<path d="'+dPath+'" fill="none" stroke="#5B54E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      dots+bars+xlab+
    '</svg>';

  const pct=Math.round(drinkCount/n*100);
  legendDrink.innerHTML=
    '<span class="cap">음주</span>'+
    '<span><i style="background:'+DRINK_COLOR+'"></i>음주</span>'+
    '<span><i style="background:#fff;border:1.5px solid #B9BED0"></i>안 마심</span>'+
    '<span class="pct">이 기간 '+drinkCount+'일 · '+pct+'%</span>';
}

/* ---------- 네비게이션 ---------- */
document.getElementById("prevBtn").onclick=()=>{ view.setMonth(view.getMonth()-1); renderCalendar(); };
document.getElementById("nextBtn").onclick=()=>{ view.setMonth(view.getMonth()+1); renderCalendar(); };
document.getElementById("todayBtn").onclick=()=>{ view=new Date(); view.setDate(1); renderCalendar(); openSheet(todayKey()); };

/* ---------- 메뉴 / 백업 ---------- */
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=()=>menu.classList.add("show");
menu.querySelector(".mbd").onclick=()=>menu.classList.remove("show");
document.getElementById("exportBtn").onclick=()=>{
  menu.classList.remove("show");
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="weight-note-"+todayKey()+".json";
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>{ menu.classList.remove("show"); document.getElementById("fileInput").click(); };
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(obj&&obj.entries){
        data.entries=Object.assign(data.entries,obj.entries);
        save(); renderCalendar(); renderChart();
        alert("복원 완료! 기록을 불러왔어요.");
      } else alert("올바른 백업 파일이 아니에요.");
    }catch(err){ alert("파일을 읽을 수 없어요."); }
  };
  r.readAsText(f); e.target.value="";
};
