<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5B54E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Weight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Weight</title>
<style>
  :root{
    --bg:#F5F6FB; --card:#FFFFFF; --ink:#1F2437; --sub:#7A809A;
    --line:#EBEDF4; --accent:#5B54E8; --accent-soft:#EEEDFD;
    --drink:#EF6C6C;
    --food-hi:#E5484D; --food-mid:#EAB308; --food-lo:#3FB950;
    --shadow:0 1px 2px rgba(31,36,55,.04),0 8px 24px rgba(31,36,55,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; padding:10px 14px 10px}
  .tabnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

  .top{display:flex; align-items:center; justify-content:space-between; padding:6px 4px 10px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .logo{width:42px;height:42px;border-radius:13px;object-fit:cover;display:block;flex:0 0 auto}
  .brand h1{font-size:20px; margin:0; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .iconbtn{border:none;background:var(--card);width:40px;height:40px;border-radius:12px;
    box-shadow:var(--shadow); color:var(--ink); font-size:18px; cursor:pointer; flex:0 0 auto}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin-bottom:10px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-title{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .cal-nav{display:flex;gap:6px;align-items:center}
  .navbtn{border:none;background:var(--bg);width:32px;height:32px;border-radius:9px;
    color:var(--ink);font-size:15px;cursor:pointer}
  .today-btn{border:none;background:var(--accent-soft);color:var(--accent);font-weight:700;
    font-size:12px;padding:0 11px;height:32px;border-radius:9px;cursor:pointer}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:11px;font-weight:700;color:var(--sub);padding-bottom:6px}
  .dow .sun{color:#E9698A}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cell{aspect-ratio:1/0.88;border-radius:11px;display:flex;flex-direction:column;
    align-items:center;padding-top:5px;cursor:pointer;position:relative;background:transparent;
    border:1px solid transparent;transition:background .12s}
  .cell.empty{cursor:default}
  .cell:active{background:var(--bg)}
  .cell .d{font-size:12px;font-weight:600;color:var(--ink);line-height:1}
  .cell.sun .d{color:#E9698A}
  .cell.has{background:#ECEBFD}
  .cell.today{background:var(--accent);}
  .cell.today .d{color:#fff}
  .cell .w{font-size:10px;font-weight:800;color:var(--accent);margin-top:3px}
  .cell.today .w{color:#fff}

  .seg{display:flex;padding:0 0 0;gap:6px;margin:0 0 10px}
  .seg button{flex:1;border:2px solid var(--line);background:var(--card);padding:9px 0;border-radius:12px;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

  .card-title{font-size:15px;font-weight:800;letter-spacing:-.3px;margin:2px 2px 10px}
  .sum3,.sum2{display:flex;margin-bottom:10px}
  .sum-tile{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    border-left:1px solid var(--line);padding:0 2px}
  .sum-tile:first-child{border-left:none}
  .sum-tile .lab{font-size:11px;color:var(--sub);font-weight:700}
  .sum-tile .val{font-size:17px;font-weight:800;white-space:nowrap}
  .sum-tile .val small{font-size:11px;color:var(--sub);font-weight:700}
  .wsum{padding-top:14px}
  .wsum .sum3{margin-bottom:2px}
  .card-title small{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:-.2px}
  .chart-box{width:100%}
  .wcard{padding-top:6px;padding-bottom:4px}
  .empty-msg{text-align:center;color:var(--sub);font-size:13px;padding:32px 0;font-weight:600}

  .hm-wrap{display:flex;gap:12px}
  .hm{flex:1;min-width:0}
  .hm .cap{font-size:12px;font-weight:800;margin:0 0 5px 1px}
  .hm .hdow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;
    font-size:9px;font-weight:700;color:var(--sub);margin-bottom:3px}
  .hm .hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .hc{aspect-ratio:1/1;border-radius:4px;border:1px solid transparent;display:flex;align-items:center;
    justify-content:center;font-size:8.5px;font-weight:700;color:rgba(31,36,55,.55);line-height:1;min-width:0}
  .hc.none{background:#fff;border-color:#D5D8E3}
  .hc.future{background:#EEF0F4;color:#B7BCCD}
  .hc.blank{visibility:hidden}
  .hc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  .legend{display:grid;grid-template-columns:28px repeat(4,54px);justify-content:center;align-items:center;margin-top:8px;
    font-size:11px;color:var(--sub);font-weight:600}
  .legend .cap{color:var(--ink);font-weight:800}
  .legend .sq{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
  .legend .sq.none{background:#fff;border:1px solid #D5D8E3}

  .backdrop{position:fixed;inset:0;background:rgba(20,22,35,.4);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:20}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);z-index:21;
    max-width:520px;margin:0 auto;box-shadow:0 -8px 40px rgba(31,36,55,.15)}
  .sheet.show{transform:translateY(0)}
  .handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 16px}
  .sheet .date-lab{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px;text-align:center}
  .field-lab{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
  .w-input{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px;
    padding:0 16px;margin-bottom:20px;border:2px solid transparent;gap:2px;overflow:hidden}
  .w-input:focus-within{border-color:var(--accent)}
  .w-input .wdigit{width:38px;flex:0 0 auto;border:none;background:transparent;font-size:26px;font-weight:800;
    padding:14px 0;outline:none;color:var(--ink);text-align:center}
  .w-input .wdigit::placeholder{color:#C4C8D8;font-weight:700}
  .w-input .wdot{font-size:26px;font-weight:800;color:var(--ink);padding:0 1px}
  .w-input .kg-lab{font-size:15px;font-weight:700;color:var(--sub);margin-left:auto}
  .rate,.drink{display:flex;gap:8px;margin-bottom:20px}
  .rate button{flex:1;border:2px solid var(--line);background:var(--card);padding:14px 0;
    border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:5px}
  .rate button .rdot{width:8px;height:8px;border-radius:50%}
  .rate button.sel[data-v="상"]{background:#FDECEC;border-color:var(--food-hi)}
  .rate button.sel[data-v="중"]{background:#FEF6D8;border-color:var(--food-mid)}
  .rate button.sel[data-v="하"]{background:#E9F8ED;border-color:var(--food-lo)}
  .drink{margin-bottom:24px}
  .drink button{flex:1;border:2px solid var(--line);background:var(--card);padding:14px 0;
    border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink)}
  .drink button.sel[data-a="0"]{border-color:var(--food-lo);background:#E9F8ED;color:var(--food-lo)}
  .drink button.sel[data-a="1"]{border-color:var(--food-mid);background:#FEF6D8;color:var(--food-mid)}
  .drink button.sel[data-a="2"]{border-color:var(--food-hi);background:#FDECEC;color:var(--food-hi)}
  .actions{display:flex;gap:10px}
  .btn{flex:1;border:none;padding:15px 0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}
  .btn.save{background:var(--accent);color:#fff}
  .btn.del{background:var(--bg);color:var(--drink);flex:0 0 96px}

  .menu{position:fixed;inset:0;z-index:22;pointer-events:none}
  .menu.show{pointer-events:auto}
  .menu .mbd{position:absolute;inset:0;background:rgba(20,22,35,.4);opacity:0;transition:opacity .2s}
  .menu.show .mbd{opacity:1}
  .menu .mpanel{position:absolute;right:16px;top:56px;background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);padding:6px;min-width:180px;transform:scale(.9);opacity:0;
    transform-origin:top right;transition:.15s}
  .menu.show .mpanel{transform:scale(1);opacity:1}
  .menu .mpanel button{display:block;width:100%;text-align:left;border:none;background:transparent;
    padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink);border-radius:10px;cursor:pointer}
  .menu .mpanel button:active{background:var(--bg)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="체중 노트">
      <h1>My Weight</h1>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button>
  </div>

  <div class="card wsum">
    <div class="sum3">
      <div class="sum-tile"><span class="lab" id="wLabLast">현재</span><span class="val tabnum" id="wLast">–</span></div>
      <div class="sum-tile"><span class="lab" id="wLabAvg">1개월 평균</span><span class="val tabnum" id="wAvg">–</span></div>
      <div class="sum-tile"><span class="lab" id="wLabChange">1개월 간</span><span class="val tabnum" id="wChange">–</span></div>
    </div>
  </div>

  <div class="card">
    <div class="cal-head">
      <div class="cal-title" id="calTitle">2026 / 07</div>
      <div class="cal-nav">
        <button class="navbtn" id="prevBtn" aria-label="이전 달">‹</button>
        <button class="today-btn" id="todayBtn">오늘</button>
        <button class="navbtn" id="nextBtn" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="dow">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="seg" id="seg">
    <button data-p="7">1주</button>
    <button data-p="31" class="on">1개월</button>
    <button data-p="183">6개월</button>
    <button data-p="365">1년</button>
  </div>

  <div class="card wcard">
    <div class="card-title" style="margin-bottom:0">체중</div>
    <div class="chart-box" id="weightBox"></div>
  </div>

  <div class="card">
    <div class="card-title" id="mixTitle">음주·식사</div>
    <div class="chart-box" id="mixBox"></div>
    <div class="legend">
      <span class="cap">음주</span>
      <span><i class="sq" style="background:#C7392F"></i>과음</span>
      <span><i class="sq" style="background:#E6B03C"></i>마심</span>
      <span><i class="sq" style="background:#A6DDB2"></i>안 마심</span>
      <span><i class="sq none"></i>미입력</span>
    </div>
    <div class="legend">
      <span class="cap">식사</span>
      <span><i class="sq" style="background:#C7392F"></i>과식</span>
      <span><i class="sq" style="background:#E6B03C"></i>보통</span>
      <span><i class="sq" style="background:#A6DDB2"></i>소식</span>
      <span><i class="sq none"></i>미입력</span>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="date-lab" id="sheetDate">2026년 7월 28일</div>
  <div class="field-lab">오늘의 체중</div>
  <div class="w-input" id="wInput">
    <input id="wD1" class="wdigit" type="tel" inputmode="numeric" maxlength="1" placeholder="0" aria-label="체중 십의 자리">
    <input id="wD2" class="wdigit" type="tel" inputmode="numeric" maxlength="1" placeholder="0" aria-label="체중 일의 자리">
    <span class="wdot">.</span>
    <input id="wD3" class="wdigit" type="tel" inputmode="numeric" maxlength="1" placeholder="0" aria-label="체중 소수 자리">
    <span class="kg-lab">kg</span>
  </div>
  <div class="field-lab">어제의 식사량</div>
  <div class="rate" id="rate">
    <button data-v="하"><span class="rdot" style="background:var(--food-lo)"></span>하</button>
    <button data-v="중"><span class="rdot" style="background:var(--food-mid)"></span>중</button>
    <button data-v="상"><span class="rdot" style="background:var(--food-hi)"></span>상</button>
  </div>
  <div class="field-lab">음주 여부</div>
  <div class="drink" id="drink">
    <button data-a="0">안 마심</button>
    <button data-a="1">마심</button>
    <button data-a="2">과음</button>
  </div>
  <div class="actions">
    <button class="btn del" id="delBtn">삭제</button>
    <button class="btn save" id="saveBtn">저장</button>
  </div>
</div>

<div class="menu" id="menu">
  <div class="mbd"></div>
  <div class="mpanel">
    <button id="installBtn" style="display:none">홈 화면에 추가</button>
    <button id="exportBtn">데이터 백업 (내보내기)</button>
    <button id="importBtn">데이터 복원 (불러오기)</button>
  </div>
</div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
const KEY="weightNote.v1";
let data=load();
let view=new Date(); view.setDate(1);
let selKey=null, selRate=null, selDrink=null;

function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function normalizeDrink(a){
  if(a===true) return 1; // 이전 버전(불리언) 데이터 호환
  if(a===0||a===1||a===2) return a;
  return null;
}

function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY)); return (r&&r.entries)?r:{entries:{}};}
  catch(e){return {entries:{}};}
}
function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }
function keyOf(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function todayKey(){ const t=new Date(); return keyOf(t.getFullYear(),t.getMonth(),t.getDate()); }

/* ---------- 체중 3칸 입력 ---------- */
const wDigits=[document.getElementById("wD1"),document.getElementById("wD2"),document.getElementById("wD3")];
wDigits.forEach((el,i)=>{
  el.addEventListener("input",()=>{
    el.value=el.value.replace(/[^0-9]/g,"").slice(0,1);
    if(el.value!=="" && i<2) wDigits[i+1].focus();
  });
  el.addEventListener("keydown",(e)=>{
    if(e.key==="Backspace" && el.value==="" && i>0){ wDigits[i-1].focus(); }
  });
});
function digitsToWeight(){
  const d1=wDigits[0].value.trim(), d2=wDigits[1].value.trim(), d3=wDigits[2].value.trim();
  if(d1===""||d2===""||d3==="") return null;
  const w=parseFloat(d1+d2+"."+d3);
  return isNaN(w)?null:w;
}
function weightToDigits(w){
  if(w==null) return ["","",""];
  const whole=Math.floor(w);
  const dec=Math.round((w-whole)*10);
  const tens=Math.floor(whole/10);
  const ones=whole%10;
  return [String(tens),String(ones),String(dec)];
}

/* ---------- 캘린더 ---------- */
function renderCalendar(){
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById("calTitle").textContent=y+"년 "+(m+1)+"월";
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const tk=todayKey();
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="cell empty"; grid.appendChild(e); }
  for(let d=1;d<=days;d++){
    const k=keyOf(y,m,d);
    const rec=data.entries[k];
    const cell=document.createElement("div");
    cell.className="cell"+((first+d-1)%7===0?" sun":"")+(rec&&(rec.w!=null||rec.f||normalizeDrink(rec.a)!==null)?" has":"")+(k===tk?" today":"");
    let html='<div class="d">'+d+'</div>';
    if(rec&&rec.w!=null) html+='<div class="w tabnum">'+fmt1(rec.w)+'</div>';
    cell.innerHTML=html;
    cell.onclick=()=>openSheet(k);
    grid.appendChild(cell);
  }
}

/* ---------- 입력 시트 ---------- */
function openSheet(k){
  selKey=k;
  const [y,m,d]=k.split("-").map(Number);
  document.getElementById("sheetDate").textContent=y+"년 "+m+"월 "+d+"일";
  const rec=data.entries[k]||{};
  const [d1,d2,d3]=weightToDigits(rec.w!=null?rec.w:null);
  wDigits[0].value=d1; wDigits[1].value=d2; wDigits[2].value=d3;
  selRate=rec.f||null;
  selDrink=normalizeDrink(rec.a);
  paintRate(); paintDrink();
  document.getElementById("delBtn").style.display=data.entries[k]?"block":"none";
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("sheet").classList.add("show");
  setTimeout(()=>{ wDigits[0].focus(); }, 300);
}
function closeSheet(){
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
function paintRate(){
  document.querySelectorAll("#rate button").forEach(b=>b.classList.toggle("sel", b.dataset.v===selRate));
}
function paintDrink(){
  document.querySelectorAll("#drink button").forEach(b=>b.classList.toggle("sel", b.dataset.a===String(selDrink)));
}
document.querySelectorAll("#rate button").forEach(b=>{
  b.onclick=()=>{ selRate=(selRate===b.dataset.v?null:b.dataset.v); paintRate(); };
});
document.querySelectorAll("#drink button").forEach(b=>{
  b.onclick=()=>{ selDrink=(selDrink===+b.dataset.a?null:+b.dataset.a); paintDrink(); };
});
document.getElementById("saveBtn").onclick=()=>{
  const w=digitsToWeight();
  if(w===null && !selRate && selDrink===null){ closeSheet(); return; }
  data.entries[selKey]={};
  if(w!==null) data.entries[selKey].w=Math.round(w*10)/10;
  if(selRate) data.entries[selKey].f=selRate;
  if(selDrink!==null) data.entries[selKey].a=selDrink;
  save(); closeSheet(); renderCalendar(); renderChart();
};
document.getElementById("delBtn").onclick=()=>{
  delete data.entries[selKey]; save(); closeSheet(); renderCalendar(); renderChart();
};
document.getElementById("backdrop").onclick=closeSheet;
document.getElementById("wInput").addEventListener("click",()=>{ wDigits[0].focus(); });

/* ---------- 통계 (체중 카드 + 음주·식사 카드) ---------- */
let period=31;
document.querySelectorAll("#seg button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); period=+b.dataset.p; renderChart();
  };
});
const C_LO="#A6DDB2", C_MID="#E6B03C", C_HI="#C7392F", C_NONE="#E3E6EE";
const LV_COLOR=[C_LO,C_MID,C_HI];
const FOOD_LV={"하":0,"중":1,"상":2};
function drinkLv(rec){ return rec?normalizeDrink(rec.a):null; }
function foodLv(rec){ return (rec&&rec.f in FOOD_LV)?FOOD_LV[rec.f]:null; }
function dayAt(base,off){ const d=new Date(base); d.setDate(d.getDate()+off); return d; }
function todayDate(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function keyOfDate(d){ return keyOf(d.getFullYear(),d.getMonth(),d.getDate()); }
function setText(id,v){ document.getElementById(id).innerHTML=v; }

// 선택 기간(오늘 기준 최근 N일)의 날짜 목록
function windowDays(){
  const now=todayDate(), out=[];
  for(let i=period-1;i>=0;i--){
    const dt=dayAt(now,-i), k=keyOfDate(dt);
    out.push({dt,k,rec:data.entries[k]||null});
  }
  return out;
}

// 6개월·1년: 첫 기록일이 선택 기간 시작일보다 늦으면 첫 기록일부터 표시
function firstRecordDate(){
  let min=null;
  for(const k in data.entries){
    const r=data.entries[k];
    if(!r||(r.w==null&&!r.f&&normalizeDrink(r.a)===null)) continue;
    if(min===null||k<min) min=k;
  }
  if(min===null) return null;
  const [y,m,d]=min.split("-").map(Number);
  return new Date(y,m-1,d);
}
function renderChart(){
  let days=windowDays(), from=null;
  if(period>31){
    from=firstRecordDate();
    if(from) days=days.filter(d=>d.dt>=from);
    if(!days.length) days=windowDays();
  }
  renderWeight(days);
  renderMix(days,from);
}

/* ----- 체중 카드 ----- */
const PERIOD_LABEL={7:"1주",31:"1개월",183:"6개월",365:"1년"};
function renderWeight(days){
  setText("wLabChange",PERIOD_LABEL[period]+" 간");
  setText("wLabAvg",PERIOD_LABEL[period]+" 평균");
  const box=document.getElementById("weightBox");
  const pts=[];
  days.forEach((d,i)=>{ if(d.rec&&d.rec.w!=null) pts.push({i,w:d.rec.w,dt:d.dt}); });
  if(!pts.length){
    ["wLast","wChange","wAvg"].forEach(id=>setText(id,"–"));
    box.innerHTML='<div class="empty-msg">이 기간에 체중 기록이 없어요.</div>';
    return;
  }
  const first=pts[0], last=pts[pts.length-1];
  const avg=pts.reduce((a,p)=>a+p.w,0)/pts.length;
  const diff=Math.round((last.w-first.w)*10)/10;
  setText("wLast",fmt1(last.w)+'<small> kg</small>');
  setText("wChange",pts.length>1?((diff>0?"+":diff<0?"−":"")+fmt1(Math.abs(diff))+'<small> kg</small>'):"–");
  setText("wAvg",fmt1(avg)+'<small> kg</small>');

  const W=340, H=125, padL=36, padR=10, iw=W-padL-padR;
  const top=18, bottom=H-18, ih=bottom-top;
  const n=days.length;
  const x=i=> n===1?padL+iw/2:padL+iw*i/(n-1);
  const ws=pts.map(p=>p.w), mn=Math.min(...ws), mx=Math.max(...ws);
  const lo=mn-.2, hi=mx+.2;
  const y=v=> top+ih*(1-(v-lo)/(hi-lo));

  // 눈금: 0.5kg 단위로 3~4개 (범위가 넓으면 1kg 단위)
  let step=.5, ticks=[];
  const mk=()=>{ ticks=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step) ticks.push(Math.round(v*10)/10); };
  mk(); if(ticks.length>4){ step=1; mk(); }
  if(!ticks.length) ticks=[Math.round((mn+mx)/2*2)/2];
  let grid="";
  ticks.forEach(v=>{
    const yy=y(v);
    grid+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#EEF0F6" stroke-width="1"/>'+
          '<text x="'+(padL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9AA0B8" font-weight="600">'+v.toFixed(1)+'</text>';
  });

  // 부드러운 곡선: monotone cubic(Fritsch-Carlson). 실제 측정값을 그대로 잇고 값 사이에서 튀어나가지 않는다.
  const P=pts.map(p=>[x(p.i),y(p.w)]);
  const m=P.length;
  const dx=[], sl=[];
  for(let j=0;j<m-1;j++){ dx[j]=P[j+1][0]-P[j][0]; sl[j]=(P[j+1][1]-P[j][1])/dx[j]; }
  const tg=[];
  for(let j=0;j<m;j++){
    if(j===0) tg[j]=m>1?sl[0]:0;
    else if(j===m-1) tg[j]=sl[m-2];
    else tg[j]=sl[j-1]*sl[j]<=0?0:3*(dx[j-1]+dx[j])/((2*dx[j]+dx[j-1])/sl[j-1]+(dx[j]+2*dx[j-1])/sl[j]);
  }
  for(let j=0;j<m-1;j++){
    if(sl[j]===0){ tg[j]=0; tg[j+1]=0; continue; }
    const aa=tg[j]/sl[j], bb=tg[j+1]/sl[j], s2=aa*aa+bb*bb;
    if(s2>9){ const t=3/Math.sqrt(s2); tg[j]=t*aa*sl[j]; tg[j+1]=t*bb*sl[j]; }
  }
  let d="";
  for(let j=0;j<m-1;j++){
    const p1=P[j], p2=P[j+1], h=dx[j]/3;
    const cy=v=>Math.min(Math.max(v,top),bottom);
    d+=(j===0?"M"+p1[0].toFixed(1)+","+p1[1].toFixed(1):"")+"C"+(p1[0]+h).toFixed(1)+","+cy(p1[1]+tg[j]*h).toFixed(1)+" "+
       (p2[0]-h).toFixed(1)+","+cy(p2[1]-tg[j+1]*h).toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  const line=d?'<path d="'+d+'" fill="none" stroke="#5B54E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':"";

  let dots="";
  const L=P[P.length-1];
  dots+='<circle cx="'+L[0].toFixed(1)+'" cy="'+L[1].toFixed(1)+'" r="6" fill="#5B54E8" stroke="#fff" stroke-width="2"/>';
  const lbx=Math.min(Math.max(L[0],padL+16),W-padR-16);
  const lby=Math.max(L[1]-14,12);
  dots+='<text x="'+lbx.toFixed(1)+'" y="'+lby.toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#5B54E8" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">'+fmt1(last.w)+'</text>';

  const idxs=n<=2?[0,n-1]:[0,Math.floor((n-1)/2),n-1];
  let xlab="";
  [...new Set(idxs)].forEach(i=>{
    const dt=days[i].dt;
    const anchor=i===0?"start":(i===n-1?"end":"middle");
    xlab+='<text x="'+x(i).toFixed(1)+'" y="'+(H-3)+'" text-anchor="'+anchor+'" font-size="10" fill="#B7BCCD" font-weight="600">'+(dt.getMonth()+1)+"/"+dt.getDate()+'</text>';
  });

  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
    grid+line+dots+xlab+'</svg>';
}

/* ----- 음주·식사 카드 ----- */
let secT={};
function renderMix(days,from){
  const tk=todayKey();
  let anyRec=0,dDrink=0,dIn=0,fHi=0,fIn=0;
  days.forEach(d=>{
    const a=drinkLv(d.rec), f=foodLv(d.rec);
    if(a!==null||f!==null) anyRec++;
    if(a!==null){ dIn++; if(a>=1) dDrink++; }
    if(f!==null){ fIn++; if(f===2) fHi++; }
  });
  const pct=(c,t)=>" ("+(t?Math.round(c/t*100)+"%":"-")+")";
  secT={drink:{b:"음주 "+dDrink+"일",n:pct(dDrink,dIn)},food:{b:"과식 "+fHi+"일",n:pct(fHi,fIn)}};
  setText("mixTitle","음주·식사 <small>(기록 "+anyRec+"일 / 경과 "+days.length+"일)</small>");

  const box=document.getElementById("mixBox");
  if(period<=31) box.innerHTML=heatmapHTML(days,tk);
  else box.innerHTML=barsSVG(period>183,from);
}

function heatmapHTML(days,tk){
  const build=(t,lvOf)=>{
    const title='<b>'+t.b+'</b>'+(t.n?'<span style="font-weight:600">'+t.n+'</span>':'');
    let cells="";
    for(let i=0;i<days[0].dt.getDay();i++) cells+='<div class="hc blank"></div>';
    days.forEach(d=>{
      const lv=lvOf(d.rec);
      const cls="hc"+(lv===null?" none":"")+(d.k===tk?" today":"");
      const bg=lv===null?"":' style="background:'+LV_COLOR[lv]+'"';
      cells+='<div class="'+cls+'"'+bg+'>'+d.dt.getDate()+'</div>';
    });
    // 마지막 주의 남은 칸 = 미래 날
    let last=days[days.length-1].dt;
    while(last.getDay()!==6){
      last=dayAt(last,1);
      cells+='<div class="hc future">'+last.getDate()+'</div>';
    }
    return '<div class="hm"><div class="cap">'+title+'</div>'+
      '<div class="hdow"><span style="color:#E9698A">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'+
      '<div class="hgrid">'+cells+'</div></div>';
  };
  return '<div class="hm-wrap">'+build(secT.drink,drinkLv)+build(secT.food,foodLv)+'</div>';
}

// 주별(6개월) / 월별(1년) 쌓인 막대. 아래부터 연녹→노랑→빨강, 남는 칸은 회색(미입력·미래)
function barsSVG(monthly,from){
  const now=todayDate();
  const groups=[]; // {days:[Date...], total, label}
  if(monthly){
    for(let m=11;m>=0;m--){
      const first=new Date(now.getFullYear(),now.getMonth()-m,1);
      const cnt=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
      const ds=[]; for(let d=0;d<cnt;d++) ds.push(dayAt(first,d));
      groups.push({ds,total:cnt,label:(first.getMonth()+1)+"월"});
    }
    if(from) while(groups.length>1 && groups[0].ds[groups[0].ds.length-1]<from) groups.shift();
  }else{
    let start=dayAt(now,-(period-1));
    if(from && from>start) start=from;
    let ws=dayAt(start,-start.getDay());
    while(ws<=now){
      const ds=[]; for(let d=0;d<7;d++) ds.push(dayAt(ws,d));
      groups.push({ds,total:7,label:null});
      ws=dayAt(ws,7);
    }
    // 월 표시: 월이 바뀌는 첫 주에만 (맨 앞 주는 바로 뒤에 라벨이 있으면 생략)
    let prev=-1; const idx=[];
    groups.forEach((g,i)=>{ const m=g.ds[0].getMonth(); if(m!==prev){ idx.push(i); prev=m; } });
    if(idx.length>1 && idx[1]<3) idx.shift();
    idx.forEach(i=>{ groups[i].label=(groups[i].ds[0].getMonth()+1)+"월"; });
  }

  const W=340, padL=4, padR=4, gapX=monthly?6:2.5;
  const nG=groups.length;
  const bwFit=(W-padL-padR-gapX*(nG-1))/nG, bw=Math.min(24,bwFit), capped=bwFit>24;
  const barH=64, maxTotal=monthly?31:7;
  const rows=[{t:secT.drink,lvOf:drinkLv,y0:18},{t:secT.food,lvOf:foodLv,y0:106}];
  const H=106+barH+28;
  let svg="";
  rows.forEach(row=>{
    svg+='<text x="'+padL+'" y="'+(row.y0-6)+'" font-size="11" font-weight="800" fill="#1F2437">'+row.t.b+(row.t.n?'<tspan font-weight="600">'+row.t.n+'</tspan>':'')+'</text>';
    const base=row.y0+barH;
    groups.forEach((g,gi)=>{
      const cnt=[0,0,0];
      g.ds.forEach(dt=>{ if(dt<=now){ const lv=row.lvOf(data.entries[keyOfDate(dt)]||null); if(lv!==null) cnt[lv]++; } });
      const unit=barH/maxTotal, bx=padL+gi*(bw+gapX);
      const totalH=g.total*unit;
      let yy=base;
      // 회색 바탕(막대 전체 높이)
      svg+='<rect x="'+bx.toFixed(1)+'" y="'+(base-totalH).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+totalH.toFixed(1)+'" rx="2" fill="'+C_NONE+'"/>';
      cnt.forEach((c,lv)=>{
        if(!c) return;
        const h=c*unit; yy-=h;
        svg+='<rect x="'+bx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+LV_COLOR[lv]+'"/>';
      });
    });
  });
  // x축(월)
  groups.forEach((g,gi)=>{
    if(!g.label) return;
    const cx=padL+gi*(bw+gapX)+(monthly?bw/2:(!capped&&gi>0&&gi>nG-4?bw:0));
    const anchor=monthly?"middle":(!capped&&gi>0&&gi>nG-4?"end":"start");
    svg+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anchor+'" font-size="10" font-weight="600" fill="#9AA0B8">'+g.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+svg+'</svg>';
}

/* ---------- 네비게이션 ---------- */
document.getElementById("prevBtn").onclick=()=>{ view.setMonth(view.getMonth()-1); renderCalendar(); };
document.getElementById("nextBtn").onclick=()=>{ view.setMonth(view.getMonth()+1); renderCalendar(); };
document.getElementById("todayBtn").onclick=()=>{ view=new Date(); view.setDate(1); renderCalendar(); openSheet(todayKey()); };

/* ---------- 메뉴 / 백업 ---------- */
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=()=>menu.classList.add("show");
menu.querySelector(".mbd").onclick=()=>menu.classList.remove("show");
document.getElementById("exportBtn").onclick=()=>{
  menu.classList.remove("show");
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="weight-note-"+todayKey()+".json";
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>{ menu.classList.remove("show"); document.getElementById("fileInput").click(); };
document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(obj&&obj.entries){
        data.entries=Object.assign(data.entries,obj.entries);
        save(); renderCalendar(); renderChart();
        alert("복원 완료! 기록을 불러왔어요.");
      } else alert("올바른 백업 파일이 아니에요.");
    }catch(err){ alert("파일을 읽을 수 없어요."); }
  };
  r.readAsText(f); e.target.value="";
};

/* ---------- 서비스워커 등록 (오프라인 + 앱 설치) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.error("SW 등록 실패:",err));
  });
}

/* ---------- 홈 화면에 추가 (PWA 설치 프롬프트) ---------- */
const installBtn=document.getElementById("installBtn");
let deferredPrompt=null;
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredPrompt=e;
  if(!isStandalone()) installBtn.style.display="block";
});
installBtn.onclick=async()=>{
  menu.classList.remove("show");
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display="none";
};
window.addEventListener("appinstalled",()=>{
  deferredPrompt=null;
  installBtn.style.display="none";
});

renderCalendar(); renderChart();
</script>
